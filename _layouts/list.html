---
layout: default
---
{%- comment -%} All visible text lives in the page front matter (title, intro, empty). {%- endcomment -%}
<div class="list">
  <header class="list-intro">
    <h1 class="post-title">{{ page.heading }}</h1>
    <div class="post-line"></div>
    <p class="list-lead">{{ page.intro }}</p>
  </header>
  {%- assign posts = site.posts | where: "lang", page.lang %}
  {% include catalogue.html posts=posts empty=page.empty %}
</div>
